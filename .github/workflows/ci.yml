name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: swift-format
        run: xcrun swift-format lint --recursive --parallel App Packages/DROPKit/Sources Packages/DROPKit/Tests
      # Config/Repo.xcconfig is the only place DROP's repository is named. Fails when the
      # repository was renamed or moved without updating it.
      - name: Repository slug
        run: |
          slug="$(scripts/repo_slug.sh)"
          echo "Config/Repo.xcconfig: $slug, GitHub: $GITHUB_REPOSITORY"
          lower() { tr '[:upper:]' '[:lower:]' <<< "$1"; }
          [ "$(lower "$slug")" = "$(lower "$GITHUB_REPOSITORY")" ]

  test:
    name: Package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --package-path Packages/DROPKit
      - name: Test
        run: swift test --package-path Packages/DROPKit

  app:
    name: App build (universal, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project DROP.xcodeproj \
            -scheme DROP \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify the universal binary and the repository slug
        run: |
          app=build/Build/Products/Release/DROP.app
          lipo -archs "$app/Contents/MacOS/DROP" | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64"
          test "$(plutil -extract DROPRepositorySlug raw "$app/Contents/Info.plist")" = "$(scripts/repo_slug.sh)"

  launch:
    name: App launch (ad-hoc signed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Signed the same way as a release will be: ad-hoc, without the Hardened Runtime.
      - name: Build (ad-hoc signed, as in a release)
        run: |
          xcodebuild build \
            -project DROP.xcodeproj \
            -scheme DROP \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO
      - name: Re-sign the app ad-hoc
        run: scripts/adhoc_sign.sh build/Build/Products/Release/DROP.app
      - name: Launch the app
        run: scripts/launch_test.sh build/Build/Products/Release/DROP.app
