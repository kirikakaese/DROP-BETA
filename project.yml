# XcodeGen spec for the app target. All logic lives in the DROPKit Swift package;
# the generated DROP.xcodeproj is not committed. Run `xcodegen generate` to create it.
name: DROP
options:
  bundleIdPrefix: com.kirikakaese
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Signing team comes from the git-ignored Config/Local.xcconfig, the repository slug from
# Config/Repo.xcconfig (both included by Config/Signing.xcconfig).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      # Universal binary: Apple Silicon + Intel.
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO

packages:
  DROPKit:
    path: Packages/DROPKit
  # Self-update. An update is installed only with a valid EdDSA signature from DROP's release key.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  DROP:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      # English and German strings for the app and the DROPKit views it shows.
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: DROPKit
        product: DROPCore
      - package: DROPKit
        product: DROPServices
      - package: DROPKit
        product: DROPUI
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: DROP
        PRODUCT_BUNDLE_IDENTIFIER: com.kirikakaese.drop
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/DROP.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  DROP:
    build:
      targets:
        DROP: all
    run:
      config: Debug
    archive:
      config: Release
